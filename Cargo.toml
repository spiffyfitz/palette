[package]
name = "palette"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A native Paint-style raster editor with a nondestructive document model"
license = "MIT"

[workspace]
members = ["crates/palette-core"]
resolver = "3"

[dependencies]
palette-core = { path = "crates/palette-core" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit", "clipboard"] }
rfd = "0.17.2"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
epaint_default_fonts = "0.37.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
pollster = "1.0.1"
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "fontconfig"] }

[target.'cfg(windows)'.dependencies]
# Reuse the already-resolved Win32 bindings to discover fonts registered outside
# the usual system/user directories. No additional native SDK or library install.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Registry"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Whole-program optimization; retain the default opt-level 3 for pixel processing.
lto = "thin"
codegen-units = 1
