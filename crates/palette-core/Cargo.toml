[package]
name = "palette-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
flate2 = "1"
tempfile = "3"
fontdue = "0.9.4"

[dev-dependencies]
epaint_default_fonts = "0.37.0"
